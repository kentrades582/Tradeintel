// ─── Shim: replace window.storage with localStorage ──────────────────────────
async function localStorageGet(key) {
  try {
    const val = localStorage.getItem(key);
    return val ? { value: val } : null;
  } catch { return null; }
}
async function localStorageSet(key, value) {
  try { localStorage.setItem(key, value); return true; } catch { return null; }
}

// ─── Utilities ────────────────────────────────────────────────────────────────
function fmt(text) {
  if (!text) return null;
  return text.split('\n').map((line, i) => {
    if (!line.trim()) return <div key={i} style={{height:'0.4rem'}}/>;
    const isBullet = /^[-*•]\s+/.test(line);
    const isH2 = line.startsWith('## ');
    const isH3 = line.startsWith('### ');
    const isH1 = line.startsWith('# ');
    const raw = isBullet?line.replace(/^[-*•]\s+/,''):isH1?line.slice(2):isH2?line.slice(3):isH3?line.slice(4):line;
    const parts = raw.split(/(\*\*[^*]+\*\*)/g).map((p,j) =>
      p.startsWith('**')&&p.endsWith('**')
        ?<strong key={j} style={{color:'var(--accent)',fontWeight:600}}>{p.slice(2,-2)}</strong>:p
    );
    if (isH1) return <div key={i} style={{color:'var(--text)',fontSize:'0.95rem',fontWeight:700,marginTop:'1rem',marginBottom:'0.35rem'}}>{parts}</div>;
    if (isH2) return <div key={i} style={{color:'var(--accent)',fontSize:'0.75rem',fontWeight:600,marginTop:'0.9rem',marginBottom:'0.35rem',textTransform:'uppercase',letterSpacing:'0.08em',fontFamily:"'IBM Plex Mono'"}}>{parts}</div>;
    if (isH3) return <div key={i} style={{color:'var(--text)',fontSize:'0.82rem',fontWeight:600,marginTop:'0.6rem',marginBottom:'0.3rem'}}>{parts}</div>;
    if (isBullet) return (
      <div key={i} style={{display:'flex',gap:'8px',marginBottom:'0.3rem',alignItems:'flex-start'}}>
        <span style={{color:'var(--accent)',flexShrink:0,marginTop:'3px',fontSize:'9px'}}>▸</span>
        <span style={{color:'var(--text2)',lineHeight:'1.65',fontSize:'13px'}}>{parts}</span>
      </div>
    );
    return <div key={i} style={{color:'var(--text2)',lineHeight:'1.7',fontSize:'13px',marginBottom:'0.25rem'}}>{parts}</div>;
  });
}

async function callClaude(prompt, webSearch=false, system='') {
  const body = { model:"claude-sonnet-4-20250514", max_tokens:1200, messages:[{role:"user",content:prompt}] };
  if (system) body.system = system;
  if (webSearch) body.tools = [{type:"web_search_20250305",name:"web_search"}];
  const res = await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  const data = await res.json();
  if (data.error) throw new Error(data.error.message);
  return data.content.filter(b=>b.type==="text").map(b=>b.text).join("\n");
}

function extractJSON(text) {
  const jb = text.match(/```json\s*([\s\S]*?)```/);
  if (jb) { try{return JSON.parse(jb[1].trim());}catch{} }
  const cb = text.match(/```\s*([\s\S]*?)```/);
  if (cb) { try{return JSON.parse(cb[1].trim());}catch{} }
  const obj = text.match(/\{[\s\S]*\}/);
  if (obj) { try{return JSON.parse(obj[0]);}catch{} }
  throw new Error("Could not parse AI response as JSON. Try again.");
}

// ─── Time ─────────────────────────────────────────────────────────────────────
function getETTime() { return new Date(new Date().toLocaleString('en-US',{timeZone:'America/New_York'})); }
function getSecsToOpen() {
  const et=getETTime();
  const target=new Date(et); target.setHours(9,30,0,0);
  if(et>=target) target.setDate(target.getDate()+1);
  while(target.getDay()===0||target.getDay()===6) target.setDate(target.getDate()+1);
  return Math.max(0,Math.floor((target-et)/1000));
}
function fmtCountdown(s) {
  if(s<=0) return 'LIVE';
  const d=Math.floor(s/86400),h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(d>0) return `${d}d ${h}h ${String(m).padStart(2,'0')}m`;
  if(h>0) return `${h}h ${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;
  return `${String(m).padStart(2,'0')}m ${String(sec).padStart(2,'0')}s`;
}
function isMarketOpen() { const et=getETTime(); const t=et.getHours()*3600+et.getMinutes()*60+et.getSeconds(); const day=et.getDay(); return day>=1&&day<=5&&t>=34200&&t<57600; }

  const [secs,setSecs] = useState(getSecsToOpen());
  const open = isMarketOpen();
  const urgent = secs<3600&&secs>0;
  useEffect(()=>{const id=setInterval(()=>setSecs(getSecsToOpen()),1000);return()=>clearInterval(id);},[]);
  const et = getETTime();

    <div style={{textAlign:'center'}}>
      <div className="lbl" style={{marginBottom:'6px'}}>{open?'Market Status':'Next Open'}</div>
      <div className="display" style={{
        fontSize:'48px',lineHeight:1,
        color:open?'var(--green)':urgent?'var(--accent)':'var(--text)',
        textShadow:open?'0 0 30px rgba(34,211,160,0.45)':urgent?'0 0 20px rgba(245,158,11,0.3)':'none',

function ResearchTab() {
  const [result,setResult]=useState('');
  const [loading,setLoading]=useState(false);
  const [query,setQuery]=useState('');
  const [active,setActive]=useState(null);
  const [err,setErr]=useState('');
  async function run(q,idx=null){
    setLoading(true);setResult('');setErr('');setActive(idx);
    try{
      const sys=`You are a professional US30/Dow Jones futures trading research assistant. Use current web search. Format with ## headers and bullet points. Be concise and actionable. End with ## Key Takeaway (1-2 sentences).`;
      setResult(await callClaude(q,true,sys));
    }catch(e){setErr(e.message);}
    setLoading(false);
  }
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
      <div className="card">
        <div className="lbl" style={{marginBottom:'12px'}}>Quick Research</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:'8px'}}>
          {RESEARCH_PRESETS.map((p,i)=>(
            <button key={i} className={`btn ${active===i?'btn-active':'btn-ghost'}`} onClick={()=>run(p.q,i)} disabled={loading}>
              {p.icon} {p.label}
            </button>
          ))}
        </div>
      </div>
      <div className="card">
        <div className="lbl" style={{marginBottom:'10px'}}>Custom Query</div>
        <div style={{display:'flex',gap:'8px'}}>
          <input value={query} onChange={e=>setQuery(e.target.value)} placeholder="e.g. What is driving the Dow this week?" onKeyDown={e=>e.key==='Enter'&&query.trim()&&run(query)}/>
          <button className="btn btn-primary" onClick={()=>run(query)} disabled={loading||!query.trim()} style={{flexShrink:0}}>Search</button>
        </div>
      </div>
      {(loading||result||err)&&(
        <div className="card fade-up">
          {loading&&(
            <div style={{display:'flex',flexDirection:'column',gap:'11px'}}>
              <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
                <div className="spin" style={{width:'13px',height:'13px',border:'2px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',flexShrink:0}}/>
                <span className="mono" style={{color:'var(--text3)',fontSize:'11px'}}>SEARCHING LIVE DATA...</span>
              </div>
              {[78,52,88,44,68].map((w,i)=><div key={i} className="shimmer" style={{height:'13px',width:`${w}%`}}/>)}
            </div>
          )}
          {err&&<div style={{color:'var(--red)',fontSize:'13px'}}>⚠ {err}</div>}
          {result&&!loading&&(
            <div className="fade-up">
              <div style={{display:'flex',alignItems:'center',gap:'8px',marginBottom:'16px',paddingBottom:'12px',borderBottom:'1px solid var(--border)'}}>
                <span style={{width:'7px',height:'7px',background:'var(--green)',borderRadius:'50%',flexShrink:0}}/>
                <span className="mono" style={{color:'var(--text3)',fontSize:'10px'}}>LIVE — {new Date().toLocaleTimeString()}</span>
              </div>
              {fmt(result)}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

const BLANK={date:new Date().toISOString().split('T')[0],time:new Date().toTimeString().slice(0,5),instrument:'YM',direction:'Long',entry:'',exit:'',contracts:'1',pnl:'',setup:'',marketContext:'',notes:'',emotion:6,outcome:'Win'};

function TradeCard({trade}){

  const pnl=parseFloat(trade.pnl)||0;

    <div className="card" style={{cursor:'pointer',padding:'16px'}} onClick={()=>setOpen(o=>!o)}>

        <div style={{display:'flex',alignItems:'center',gap:'10px',flexWrap:'wrap'}}>
          <span className="mono" style={{color:'var(--text)',fontSize:'15px',fontWeight:600}}>{trade.instrument}</span>
          <span className={`tag tag-${trade.direction.toLowerCase()}`}>{trade.direction}</span>
          <span className={`tag tag-${trade.outcome==='BE'?'be':trade.outcome.toLowerCase()}`}>{trade.outcome}</span>
          <span className="mono" style={{color:'var(--text3)',fontSize:'11px'}}>{trade.date} {trade.time}</span>

        <div style={{display:'flex',alignItems:'center',gap:'14px'}}>

          <span style={{color:'var(--text3)',fontSize:'12px'}}>{open?'▲':'▼'}</span>
        </div>
      </div>
      {open&&(
        <div className="fade-up" style={{marginTop:'16px',paddingTop:'14px',borderTop:'1px solid var(--border)',display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:'12px'}}>
          <div><div className="lbl">Entry → Exit</div><div className="mono" style={{fontSize:'13px',marginTop:'4px'}}>{trade.entry} → {trade.exit}</div></div>
          <div><div className="lbl">Emotion</div><div className="mono" style={{fontSize:'13px',marginTop:'4px'}}>{trade.emotion}/10</div></div>
          <div><div className="lbl">Contracts</div><div className="mono" style={{fontSize:'13px',marginTop:'4px'}}>{trade.contracts}</div></div>
          {trade.setup&&<div style={{gridColumn:'span 3'}}><div className="lbl">Setup</div><div style={{color:'var(--text2)',fontSize:'13px',lineHeight:'1.6',marginTop:'4px'}}>{trade.setup}</div></div>}
          {trade.marketContext&&<div style={{gridColumn:'span 3'}}><div className="lbl">Context</div><div style={{color:'var(--text2)',fontSize:'13px',lineHeight:'1.6',marginTop:'4px'}}>{trade.marketContext}</div></div>}
          {trade.notes&&<div style={{gridColumn:'span 3'}}><div className="lbl">Notes</div><div style={{color:'var(--text2)',fontSize:'13px',lineHeight:'1.6',marginTop:'4px'}}>{trade.notes}</div></div>}

      )}

  );
}

function JournalTab({trades,onAdd}){
  const [form,setForm]=useState(BLANK);
  const [show,setShow]=useState(false);
  const [saving,setSaving]=useState(false);
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  useEffect(()=>{
    const inst=INSTRUMENTS.find(i=>i.id===form.instrument);
    if(!inst||!form.entry||!form.exit||!form.contracts)return;
    const diff=(form.direction==='Long'?1:-1)*(parseFloat(form.exit)-parseFloat(form.entry));
    const pnl=((diff/inst.tick)*inst.tickVal*parseInt(form.contracts||1)).toFixed(2);
    set('pnl',pnl);set('outcome',parseFloat(pnl)>0?'Win':parseFloat(pnl)<0?'Loss':'BE');
  },[form.entry,form.exit,form.contracts,form.instrument,form.direction]);
  async function save(){if(!form.entry)return;setSaving(true);await onAdd({...form,id:Date.now()});setForm({...BLANK,date:new Date().toISOString().split('T')[0]});setShow(false);setSaving(false);}
  const F=({label,children})=><div><div className="lbl" style={{marginBottom:'5px'}}>{label}</div>{children}</div>;
  const Tog=({opts,val,onChange})=>(
    <div style={{display:'flex',gap:'5px'}}>
      {opts.map(o=><button key={o} className={`btn ${val===o?'btn-active':'btn-ghost'}`} style={{flex:1,padding:'7px 8px',fontSize:'12px'}} onClick={()=>onChange(o)}>{o}</button>)}
    </div>
  );
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
      {!show
        ?<button className="btn btn-primary" style={{alignSelf:'flex-start'}} onClick={()=>setShow(true)}>+ Log Trade</button>
        :(
          <div className="card fade-up">
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'20px'}}>
              <div style={{fontWeight:600,fontSize:'14px'}}>New Trade Entry</div>
              <button className="btn btn-ghost" style={{padding:'5px 10px',fontSize:'12px'}} onClick={()=>setShow(false)}>✕</button>
            </div>
            <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'13px'}}>
              <F label="Date"><input type="date" value={form.date} onChange={e=>set('date',e.target.value)}/></F>
              <F label="Time"><input type="time" value={form.time} onChange={e=>set('time',e.target.value)}/></F>
              <F label="Instrument"><select value={form.instrument} onChange={e=>set('instrument',e.target.value)}>{INSTRUMENTS.map(i=><option key={i.id} value={i.id}>{i.id} — {i.name}</option>)}</select></F>
              <F label="Contracts"><input type="number" min="1" value={form.contracts} onChange={e=>set('contracts',e.target.value)}/></F>
              <F label="Direction"><Tog opts={['Long','Short']} val={form.direction} onChange={v=>set('direction',v)}/></F>
              <F label="Outcome"><Tog opts={['Win','Loss','BE']} val={form.outcome} onChange={v=>set('outcome',v)}/></F>
              <F label="Entry Price"><input type="number" step="1" value={form.entry} onChange={e=>set('entry',e.target.value)} placeholder="0"/></F>
              <F label="Exit Price"><input type="number" step="1" value={form.exit} onChange={e=>set('exit',e.target.value)} placeholder="0"/></F>
              <F label="P&L ($)"><input type="number" step="0.01" value={form.pnl} onChange={e=>set('pnl',e.target.value)} placeholder="Auto-calculated"/></F>
              <F label={`Emotion ${form.emotion}/10`}>
                <div style={{paddingTop:'4px'}}>
                  <input type="range" min="1" max="10" value={form.emotion} onChange={e=>set('emotion',parseInt(e.target.value))}/>
                  <div style={{display:'flex',justifyContent:'space-between',marginTop:'3px'}}>
                    <span className="mono" style={{color:'var(--text3)',fontSize:'10px'}}>Stressed</span>
                    <span className="mono" style={{color:'var(--text3)',fontSize:'10px'}}>Calm</span>
                  </div>
                </div>
              </F>
            </div>
            <div style={{display:'grid',gap:'13px',marginTop:'13px'}}>
              <F label="Setup / Entry Reason"><textarea rows={3} value={form.setup} onChange={e=>set('setup',e.target.value)} placeholder="Why did you enter? What was the setup?" style={{resize:'vertical'}}/></F>
              <F label="Market Context / News"><textarea rows={2} value={form.marketContext} onChange={e=>set('marketContext',e.target.value)} placeholder="What was happening? Any news?" style={{resize:'vertical'}}/></F>
              <F label="Lessons / Notes"><textarea rows={2} value={form.notes} onChange={e=>set('notes',e.target.value)} placeholder="What would you do differently?" style={{resize:'vertical'}}/></F>
            </div>
            <div style={{display:'flex',gap:'8px',marginTop:'18px'}}>
              <button className="btn btn-primary" onClick={save} disabled={saving||!form.entry}>{saving?'Saving...':'Save Trade'}</button>
              <button className="btn btn-ghost" onClick={()=>setShow(false)}>Cancel</button>
            </div>
          </div>
        )
      }
      {trades.length===0
        ?<div className="card" style={{textAlign:'center',padding:'44px 24px',color:'var(--text3)'}}>
            <div style={{fontSize:'36px',marginBottom:'10px'}}>📒</div>
            <div style={{fontWeight:500,fontSize:'14px',marginBottom:'5px',color:'var(--text2)'}}>No trades logged yet</div>
            <div style={{fontSize:'12px'}}>Every trade you log becomes data. Start building your edge.</div>
          </div>
        :<>
          <div className="mono" style={{color:'var(--text3)',fontSize:'10px'}}>{trades.length} TRADES LOGGED</div>
          {trades.map(t=><TradeCard key={t.id} trade={t}/>)}
        </>
      }
    </div>
  );
}

function AnalysisTab({trades}){
  const [result,setResult]=useState('');
  const [loading,setLoading]=useState(false);
  const [err,setErr]=useState('');
  const n=trades.length;
  const wins=trades.filter(t=>t.outcome==='Win');
  const losses=trades.filter(t=>t.outcome==='Loss');
  const wr=n>0?Math.round(wins.length/n*100):0;
  const tot=trades.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0);
  const avgW=wins.length>0?wins.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0)/wins.length:0;
  const avgL=losses.length>0?losses.reduce((s,t)=>s+(parseFloat(t.pnl)||0),0)/losses.length:0;
  const rr=avgL!==0?Math.abs(avgW/avgL).toFixed(2):'—';
  const emoW=wins.length>0?(wins.reduce((s,t)=>s+t.emotion,0)/wins.length).toFixed(1):'—';
  const emoL=losses.length>0?(losses.reduce((s,t)=>s+t.emotion,0)/losses.length).toFixed(1):'—';
  const byInst={};
  trades.forEach(t=>{if(!byInst[t.instrument])byInst[t.instrument]={w:0,l:0,pnl:0,n:0};byInst[t.instrument].n++;byInst[t.instrument].pnl+=parseFloat(t.pnl)||0;if(t.outcome==='Win')byInst[t.instrument].w++;if(t.outcome==='Loss')byInst[t.instrument].l++;});
  async function analyse(){
    if(!n)return;setLoading(true);setResult('');setErr('');
    const j=trades.map(t=>`[${t.date} ${t.time}] ${t.instrument} ${t.direction} ${t.contracts}ct | Entry:${t.entry} Exit:${t.exit} | P&L:$${t.pnl} | ${t.outcome} | Emotion:${t.emotion}/10 | Setup:"${t.setup}" | Context:"${t.marketContext}" | Notes:"${t.notes}"`).join('\n');
    try{setResult(await callClaude(`My trading journal (${n} trades):\n\n${j}\n\nAnalyse with ## Win/Loss Patterns ## Emotional Patterns ## My Real Edge ## Biggest Weaknesses ## 3 Specific Actions`,false,"You are a professional trading coach. Be specific, honest, and reference actual trades. No generic advice."));}
    catch(e){setErr(e.message);}
    setLoading(false);
  }
  const S=({label,val,sub,c})=>(
    <div className="card" style={{flex:1,minWidth:'120px'}}>
      <div className="lbl" style={{marginBottom:'8px'}}>{label}</div>
      <div className="display" style={{fontSize:'30px',color:c||'var(--text)',lineHeight:1}}>{val}</div>
      {sub&&<div style={{color:'var(--text3)',fontSize:'11px',marginTop:'4px'}}>{sub}</div>}
    </div>
  );
  return (
    <div style={{display:'flex',flexDirection:'column',gap:'16px'}}>
      <div style={{display:'flex',gap:'10px',flexWrap:'wrap'}}>
        <S label="Trades" val={n} sub={`${wins.length}W · ${losses.length}L`}/>
        <S label="Win Rate" val={`${wr}%`} c={wr>=50?'var(--green)':'var(--red)'} sub="target >50%"/>
        <S label="Net P&L" val={`$${tot.toFixed(0)}`} c={tot>=0?'var(--green)':'var(--red)'} sub={`avg $${(n>0?tot/n:0).toFixed(0)}/trade`}/>
        <S label="Avg Win" val={`$${avgW.toFixed(0)}`} c="var(--green)" sub={`Loss avg $${avgL.toFixed(0)}`}/>
        <S label="R:R" val={rr} sub="win ÷ loss"/>
        <S label="Emo W/L" val={`${emoW}/${emoL}`} sub="10=calm"/>
      </div>
      {Object.keys(byInst).length>0&&(
        <div className="card">
          <div className="lbl" style={{marginBottom:'13px'}}>By Instrument</div>
          {Object.entries(byInst).map(([inst,d])=>(
            <div key={inst} style={{display:'flex',alignItems:'center',gap:'12px',padding:'9px 13px',background:'var(--s2)',borderRadius:'7px',border:'1px solid var(--border)',marginBottom:'6px'}}>
              <span className="mono" style={{fontWeight:600,width:'40px'}}>{inst}</span>
              <span style={{color:'var(--text3)',fontSize:'12px'}}>{d.n} trades</span>
              <span style={{color:'var(--green)',fontSize:'12px'}}>{d.w}W</span>
              <span style={{color:'var(--red)',fontSize:'12px'}}>{d.l}L</span>
              <span className="mono" style={{marginLeft:'auto',color:d.pnl>=0?'var(--green)':'var(--red)',fontWeight:600}}>{d.pnl>=0?'+':''}${d.pnl.toFixed(0)}</span>
              <span style={{color:'var(--text3)',fontSize:'12px'}}>{d.n>0?Math.round(d.w/d.n*100):0}%</span>
            </div>
          ))}
        </div>
      )}
      <div className="card">
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'12px',flexWrap:'wrap',marginBottom:result||loading?'16px':'0'}}>
          <div>
            <div style={{fontWeight:600,fontSize:'14px',marginBottom:'3px'}}>AI Pattern Analysis</div>
            <div style={{color:'var(--text3)',fontSize:'12px'}}>Your coach reads the journal and tells you exactly what to fix</div>
          </div>
          <button className="btn btn-primary" onClick={analyse} disabled={loading||!n}>{loading?'Analysing...':!n?'No trades yet':'Run Analysis'}</button>
        </div>
        {loading&&(<div style={{display:'flex',flexDirection:'column',gap:'10px'}}><div style={{display:'flex',alignItems:'center',gap:'10px'}}><div className="spin" style={{width:'13px',height:'13px',border:'2px solid var(--border)',borderTopColor:'var(--accent)',borderRadius:'50%',flexShrink:0}}/><span className="mono" style={{color:'var(--text3)',fontSize:'11px'}}>READING {n} TRADES...</span></div>{[72,55,82,42,65].map((w,i)=><div key={i} className="shimmer" style={{height:'12px',width:`${w}%`}}/>)}</div>)}
        {err&&<div style={{color:'var(--red)',fontSize:'13px'}}>{err}</div>}
        {result&&!loading&&<div className="fade-up" style={{paddingTop:'16px',borderTop:'1px solid var(--border)'}}>{fmt(result)}</div>}
        {n>0&&n<5&&!result&&!loading&&<div style={{color:'var(--text3)',fontSize:'12px',padding:'11px',background:'var(--s2)',borderRadius:'7px',border:'1px solid var(--border)',marginTop:'12px'}}>💡 Log 20+ trades for meaningful patterns.</div>}
      </div>
    </div>
  );
}

// ─── Risk Calculator ──────────────────────────────────────────────────────────
function RiskTab(){
  const [account,setAccount]=useState('5000');
  const [riskPct,setRiskPct]=useState('1');
  const [inst,setInst]=useState('MYM');
  const [entry,setEntry]=useState('');
  const [stop,setStop]=useState('');
  const [dir,setDir]=useState('Long');
  const [dloss,setDloss]=useState('0');
  const [maxDL,setMaxDL]=useState('');
  const instrument=INSTRUMENTS.find(i=>i.id===inst);
  const acc=parseFloat(account)||0;
  const riskDollar=(parseFloat(riskPct)/100)*acc;
  const ent=parseFloat(entry)||0;const stp=parseFloat(stop)||0;const dist=Math.abs(ent-stp);
  const ticks=instrument&&dist>0?dist/instrument.tick:0;
  const riskPerCt=instrument?ticks*instrument.tickVal:0;
  const maxCt=riskPerCt>0?Math.floor(riskDollar/riskPerCt):0;
  const actualRisk=maxCt*riskPerCt;const actualPct=acc>0?(actualRisk/acc*100).toFixed(2):'0';
  const dl=parseFloat(dloss)||0;const mdl=parseFloat(maxDL)||(acc*0.02);const remain=mdl-dl;
  const burnPct=mdl>0?Math.min(100,Math.round(dl/mdl*100)):0;
  const barColor=burnPct>=100?'var(--red)':burnPct>=75?'var(--accent)':'var(--green)';
  const R=({label,val,c})=>(<div style={{display:'flex',justifyContent:'space-between',padding:'3px 0'}}><span style={{color:'var(--text3)',fontSize:'12px'}}>{label}</span><span className="mono" style={{color:c||'var(--text)',fontSize:'12px',fontWeight:500}}>{val}</span></div>);
  const F=({label,children})=><div><div className="lbl" style={{marginBottom:'5px'}}>{label}</div>{children}</div>;
  return(
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'16px'}}>
      <div className="card">
        <div className="lbl" style={{marginBottom:'16px'}}>Position Sizer</div>
        <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
          <F label="Account ($)"><input type="number" value={account} onChange={e=>setAccount(e.target.value)} placeholder="5000"/></F>
          <F label="Risk Per Trade (%)"><input type="number" step="0.25" value={riskPct} onChange={e=>setRiskPct(e.target.value)} placeholder="1"/></F>
          <F label="Instrument"><select value={inst} onChange={e=>setInst(e.target.value)}>{INSTRUMENTS.map(i=><option key={i.id} value={i.id}>{i.id} — {i.name}</option>)}</select></F>
          <F label="Direction"><div style={{display:'flex',gap:'6px'}}>{['Long','Short'].map(d=><button key={d} className={`btn ${dir===d?'btn-active':'btn-ghost'}`} style={{flex:1,padding:'7px'}} onClick={()=>setDir(d)}>{d}</button>)}</div></F>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'8px'}}>
            <F label="Entry"><input type="number" step="1" value={entry} onChange={e=>setEntry(e.target.value)} placeholder="0"/></F>
            <F label="Stop Loss"><input type="number" step="1" value={stop} onChange={e=>setStop(e.target.value)} placeholder="0"/></F>
          </div>
        </div>
        {ent>0&&stp>0&&(
          <div className="fade-up card-inner" style={{marginTop:'16px',display:'flex',flexDirection:'column',gap:'8px'}}>
            <R label="Stop Distance" val={`${dist.toFixed(0)} pts · ${ticks.toFixed(0)} ticks`}/>
            <R label="Risk/Contract" val={`$${riskPerCt.toFixed(0)}`} c="var(--red)"/>
            <R label="Risk Budget" val={`$${riskDollar.toFixed(0)} (${riskPct}%)`}/>
            <div style={{height:'1px',background:'var(--border)',margin:'4px 0'}}/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{color:'var(--text)',fontWeight:600}}>Max Contracts</span>
              <span className="display" style={{fontSize:'40px',color:'var(--accent)',lineHeight:1}}>{maxCt}</span>
            </div>
            <R label="Actual at Risk" val={`$${actualRisk.toFixed(0)} (${actualPct}%)`} c="var(--text2)"/>
            {maxCt===0&&riskPerCt>0&&<div style={{color:'var(--accent)',fontSize:'12px',padding:'8px',background:'var(--adim)',borderRadius:'6px'}}>⚠ Stop too wide. Tighten or increase risk budget.</div>}
          </div>
        )}
        <div style={{marginTop:'14px',padding:'12px',background:'var(--adim2)',border:'1px solid rgba(245,158,11,0.1)',borderRadius:'8px'}}>
          <div className="lbl" style={{marginBottom:'4px'}}>Sizing Rules</div>
          <div style={{color:'var(--text3)',fontSize:'12px',lineHeight:'1.6'}}>Risk 0.5–1% per trade. Start with micro contracts. Never size up without 50+ trade proof of edge.</div>
        </div>
      </div>
      <div className="card">
        <div className="lbl" style={{marginBottom:'16px'}}>Daily Loss Tracker</div>
        <div style={{display:'flex',flexDirection:'column',gap:'12px'}}>
          <F label="Max Daily Loss ($)"><input type="number" value={maxDL} onChange={e=>setMaxDL(e.target.value)} placeholder={`${(acc*0.02).toFixed(0)} (2% default)`}/></F>
          <F label="Loss Today ($)"><input type="number" value={dloss} onChange={e=>setDloss(e.target.value)} placeholder="0"/></F>
        </div>
        <div style={{marginTop:'20px'}}>
          <div style={{display:'flex',justifyContent:'space-between',marginBottom:'7px'}}>
            <span className="lbl">Daily limit burned</span>
            <span className="mono" style={{fontSize:'11px',color:barColor}}>{burnPct}%</span>
          </div>
          <div style={{background:'var(--s4)',borderRadius:'4px',height:'8px',overflow:'hidden'}}>
            <div style={{height:'100%',width:`${burnPct}%`,background:barColor,borderRadius:'4px',transition:'width 0.4s'}}/>
          </div>
          <div className="card-inner" style={{marginTop:'16px',display:'flex',flexDirection:'column',gap:'8px'}}>
            <R label="Max Daily Loss" val={`$${mdl.toFixed(0)}`} c="var(--red)"/>
            <R label="Lost Today" val={`$${dl.toFixed(0)}`} c={dl>0?'var(--red)':'var(--text2)'}/>
            <div style={{height:'1px',background:'var(--border)',margin:'4px 0'}}/>
            <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <span style={{color:'var(--text)',fontWeight:600}}>Remaining</span>
              <span className="display" style={{fontSize:remain<=0?'18px':'36px',color:remain<=0?'var(--red)':remain<mdl*0.25?'var(--accent)':'var(--green)',lineHeight:1}}>
                {remain<=0?'STOP NOW':`$${remain.toFixed(0)}`}
              </span>
            </div>
          </div>
          {burnPct>=100&&<div className="fade-up" style={{marginTop:'12px',padding:'13px',background:'var(--rdim)',border:'1px solid rgba(240,96,96,0.25)',borderRadius:'8px'}}><div style={{color:'var(--red)',fontWeight:700,marginBottom:'4px'}}>🛑 Daily Limit Reached</div><div style={{color:'var(--text2)',fontSize:'12px'}}>Close all positions. Log off. Come back tomorrow.</div></div>}
          {burnPct>=75&&burnPct<100&&<div className="fade-up" style={{marginTop:'12px',padding:'11px',background:'var(--adim)',border:'1px solid rgba(245,158,11,0.2)',borderRadius:'8px'}}><div style={{color:'var(--accent)',fontWeight:600,marginBottom:'3px'}}>⚠ 75% Used</div><div style={{color:'var(--text3)',fontSize:'12px'}}>High-conviction only. Consider stopping now.</div></div>}
        </div>
        <div style={{marginTop:'14px',padding:'12px',background:'var(--adim2)',border:'1px solid rgba(245,158,11,0.1)',borderRadius:'8px'}}>
          <div className="lbl" style={{marginBottom:'4px'}}>Daily Rules</div>
          <div style={{color:'var(--text3)',fontSize:'12px',lineHeight:'1.6'}}>2% max daily loss. After 2 losses, 30-min break. Anger = stop. No exceptions.</div>
        </div>
      </div>
    </div>
  );
}

// ─── Main App ─────────────────────────────────────────────────────────────────
const TABS=[
  {id:'brief',   label:'Morning Brief',icon:'⚡'},
  {id:'research',label:'Research',     icon:'🔍'},
  {id:'journal', label:'Journal',      icon:'📒'},
  {id:'analysis',label:'Analysis',     icon:'📊'},
  {id:'risk',    label:'Risk Calc',    icon:'🛡️'},
];

function App() {
  const [tab,setTab]=useState('brief');
  const [trades,setTrades]=useState([]);
  const [ready,setReady]=useState(false);
  useEffect(()=>{loadTrades().then(t=>{setTrades(t);setReady(true);});},[]);
  async function addTrade(t){const u=[t,...trades];setTrades(u);await saveTrades(u);}
  useEffect(()=>{
    setTimeout(()=>{
      const splash=document.getElementById('splash');
      if(splash){splash.style.opacity='0';setTimeout(()=>splash.remove(),400);}
    },1200);
  },[]);
  return(
    <div style={{minHeight:'100vh',background:'var(--bg)'}}>
      <style dangerouslySetInnerHTML={{__html:CSS}}/>
      <div className="grid-bg" style={{position:'fixed',inset:0,pointerEvents:'none',opacity:0.5,zIndex:0}}/>
      <div style={{position:'fixed',top:'-150px',right:'-150px',width:'500px',height:'500px',background:'radial-gradient(circle,rgba(245,158,11,0.05) 0%,transparent 70%)',pointerEvents:'none',zIndex:0}}/>
      <header style={{position:'sticky',top:0,zIndex:100,background:'rgba(3,7,17,0.93)',backdropFilter:'blur(16px)',borderBottom:'1px solid var(--border)',padding:'0 20px'}}>
        <div style={{maxWidth:'1160px',margin:'0 auto',display:'flex',alignItems:'center',justifyContent:'space-between',height:'54px'}}>
          <div style={{display:'flex',alignItems:'center',gap:'10px'}}>
            <div style={{width:'30px',height:'30px',background:'var(--accent)',borderRadius:'7px',display:'flex',alignItems:'center',justifyContent:'center',boxShadow:'0 0 14px rgba(245,158,11,0.35)'}}>
              <span style={{fontFamily:"'Bebas Neue',cursive",fontSize:'16px',color:'#030711',letterSpacing:'0.04em'}}>TI</span>
            </div>
            <div>
              <span className="mono" style={{fontSize:'13px',fontWeight:500,color:'var(--text)'}}>TradeIntel<span style={{color:'var(--accent)'}}>_</span></span>
              <span className="mono" style={{color:'var(--text3)',fontSize:'10px',marginLeft:'7px'}}>US30</span>
            </div>
          </div>
          <nav style={{display:'flex',gap:'2px'}}>
            {TABS.map(t=>(
              <button key={t.id} onClick={()=>setTab(t.id)} style={{padding:'6px 13px',borderRadius:'6px',border:'none',cursor:'pointer',fontFamily:"'DM Sans',sans-serif",fontSize:'12px',fontWeight:500,transition:'all 0.15s',background:tab===t.id?'var(--adim)':'transparent',color:tab===t.id?'var(--accent)':'var(--text3)',borderBottom:tab===t.id?'2px solid var(--accent)':'2px solid transparent'}}>{t.icon} {t.label}</button>
            ))}
          </nav>
          <div style={{display:'flex',alignItems:'center',gap:'7px'}}>
            <span style={{width:'6px',height:'6px',background:isMarketOpen()?'var(--green)':'var(--red)',borderRadius:'50%',boxShadow:isMarketOpen()?'0 0 7px rgba(34,211,160,0.7)':'0 0 7px rgba(240,96,96,0.7)'}}/>
            <span className="mono" style={{color:'var(--text3)',fontSize:'10px'}}>{isMarketOpen()?'MARKET OPEN':'CLOSED'}<span className="blink" style={{marginLeft:'3px'}}>|</span></span>
          </div>
        </div>
      </header>
      <main style={{maxWidth:'1160px',margin:'0 auto',padding:'24px 20px',position:'relative',zIndex:1}}>
        {!ready
          ?<div style={{display:'flex',flexDirection:'column',gap:'14px'}}>{[1,2,3].map(i=><div key={i} className="shimmer" style={{height:'80px',borderRadius:'12px'}}/>)}</div>
          :<div className="fade-up" key={tab}>
              {tab==='brief'    &&<BriefTab/>}
              {tab==='research' &&<ResearchTab/>}
              {tab==='journal'  &&<JournalTab trades={trades} onAdd={addTrade}/>}
              {tab==='analysis' &&<AnalysisTab trades={trades}/>}
              {tab==='risk'     &&<RiskTab/>}
            </div>
        }
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
